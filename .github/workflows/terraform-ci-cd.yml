name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform Action to execute"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # =============================================================
  # 1. Application Lint & Unit Test Suite
  # =============================================================
  app-test:
    name: "Application Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./app/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # =============================================================
  # 2. Terraform Quality, Security & Deployment
  # =============================================================
  terraform:
    name: "Terraform Infrastructure"
    needs: [app-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ACCESS_KEY_ID != ''
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: env.AWS_ACCESS_KEY_ID != '' && (github.event_name == 'pull_request' || inputs.action == 'plan')
        run: |
          terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        id: apply
        if: env.AWS_ACCESS_KEY_ID != '' && (((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push') || inputs.action == 'apply')
        run: |
          terraform apply -auto-approve
          echo "APP_URL=$(terraform output -raw application_url)" >> $GITHUB_ENV
          echo "HEALTH_URL=$(terraform output -raw health_check_url)" >> $GITHUB_ENV

      - name: Post-Deployment End-to-End Health Check
        if: env.HEALTH_URL != ''
        run: |
          echo "Validating application health at: $HEALTH_URL"
          for i in {1..12}; do
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Health check passed with HTTP 200 OK!"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Health check timed out or returned non-200"
          exit 1

      - name: Terraform Destroy (Manual Trigger Only)
        if: inputs.action == 'destroy' && env.AWS_ACCESS_KEY_ID != ''
        run: terraform destroy -auto-approve

