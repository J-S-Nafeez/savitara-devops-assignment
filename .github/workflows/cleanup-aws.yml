name: "Destroy / Cleanup AWS Resources"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: "Wipe Lingering AWS Resources"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete ALB, Listeners and Target Groups
        run: |
          echo "=== 1. Deleting ALB ==="
          ALB_ARN=$(aws elbv2 describe-load-balancers --names savitara-prod-alb --query "LoadBalancers[0].LoadBalancerArn" --output text 2>/dev/null || true)
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "Deleting Load Balancer: $ALB_ARN"
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN"
            sleep 15
          fi

          TG_ARN=$(aws elbv2 describe-target-groups --names savitara-prod-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || true)
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            echo "Deleting Target Group: $TG_ARN"
            aws elbv2 delete-target-group --target-group-arn "$TG_ARN" || true
          fi

      - name: Delete Secrets Manager Secret
        run: |
          echo "=== 2. Deleting Secrets Manager Secret ==="
          aws secretsmanager delete-secret --secret-id savitara-prod-rds-mysql-credentials --force-delete-without-recovery 2>/dev/null || true

      - name: Delete RDS Subnet Group & Parameter Group
        run: |
          echo "=== 3. Deleting RDS groups ==="
          aws rds delete-db-subnet-group --db-subnet-group-name savitara-prod-db-subnet-group 2>/dev/null || true
          aws rds delete-db-parameter-group --db-parameter-group-name savitara-prod-mysql8-params 2>/dev/null || true

      - name: Delete IAM Roles and Policies
        run: |
          echo "=== 4. Deleting IAM roles and policies ==="
          aws iam remove-role-from-instance-profile --instance-profile-name savitara-prod-ec2-instance-profile --role-name savitara-prod-ec2-role 2>/dev/null || true
          aws iam delete-instance-profile --instance-profile-name savitara-prod-ec2-instance-profile 2>/dev/null || true
          
          # Detach policies
          for pol in $(aws iam list-attached-role-policies --role-name savitara-prod-ec2-role --query "AttachedPolicies[*].PolicyArn" --output text 2>/dev/null || true); do
            aws iam detach-role-policy --role-name savitara-prod-ec2-role --policy-arn "$pol" 2>/dev/null || true
          done
          aws iam delete-role --role-name savitara-prod-ec2-role 2>/dev/null || true

          # Delete custom policies
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          aws iam delete-policy --policy-arn "arn:aws:iam::${ACCOUNT_ID}:policy/savitara-prod-secrets-manager-policy" 2>/dev/null || true
          aws iam delete-policy --policy-arn "arn:aws:iam::${ACCOUNT_ID}:policy/savitara-prod-s3-app-policy" 2>/dev/null || true

      - name: Delete S3 Buckets
        run: |
          echo "=== 5. Deleting S3 Buckets ==="
          for b in $(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'savitara-prod-')].Name" --output text 2>/dev/null || true); do
            echo "Emptying and deleting S3 bucket: $b"
            aws s3 rm "s3://$b" --recursive 2>/dev/null || true
            aws s3api delete-bucket --bucket "$b" 2>/dev/null || true
          done

      - name: Delete NAT Gateway and EIP
        run: |
          echo "=== 6. Deleting NAT Gateway & Releasing EIP ==="
          NAT_IDS=$(aws ec2 describe-nat-gateways --filter "Name=tag:Name,Values=savitara-prod-nat-gw" "Name=state,Values=available,pending" --query "NatGateways[*].NatGatewayId" --output text 2>/dev/null || true)
          for nat in $NAT_IDS; do
            if [ -n "$nat" ] && [ "$nat" != "None" ]; then
              echo "Deleting NAT Gateway: $nat"
              aws ec2 delete-nat-gateway --nat-gateway-id "$nat" || true
            fi
          done

          if [ -n "$NAT_IDS" ] && [ "$NAT_IDS" != "None" ]; then
            echo "Waiting 60 seconds for NAT Gateway deletion before deleting VPC/EIP..."
            sleep 60
          fi

          for alloc in $(aws ec2 describe-addresses --filters "Name=tag:Name,Values=savitara-prod-nat-eip" --query "Addresses[*].AllocationId" --output text 2>/dev/null || true); do
            echo "Releasing EIP: $alloc"
            aws ec2 release-address --allocation-id "$alloc" 2>/dev/null || true
          done

      - name: Delete Security Groups
        run: |
          echo "=== 7. Deleting Security Groups ==="
          for sg in $(aws ec2 describe-security-groups --filters "Name=tag:Name,Values=savitara-prod-alb-sg,savitara-prod-ec2-app-sg,savitara-prod-rds-sg" --query "SecurityGroups[*].GroupId" --output text 2>/dev/null || true); do
            aws ec2 delete-security-group --group-id "$sg" 2>/dev/null || true
          done

      - name: Delete VPC, Subnets & Gateways
        run: |
          echo "=== 8. Deleting VPC and subnets ==="
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=savitara-prod-vpc" --query "Vpcs[0].VpcId" --output text 2>/dev/null || true)
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Found VPC: $VPC_ID"
            
            # Detach and delete IGW
            for igw in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query "InternetGateways[*].InternetGatewayId" --output text 2>/dev/null || true); do
              aws ec2 detach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$VPC_ID" 2>/dev/null || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$igw" 2>/dev/null || true
            done

            # Delete subnets
            for sub in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query "Subnets[*].SubnetId" --output text 2>/dev/null || true); do
              aws ec2 delete-subnet --subnet-id "$sub" 2>/dev/null || true
            done

            # Delete custom route tables
            for rtb in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" --query "RouteTables[?Associations[0].Main!=true].RouteTableId" --output text 2>/dev/null || true); do
              aws ec2 delete-route-table --route-table-id "$rtb" 2>/dev/null || true
            done

            # Delete VPC
            aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
            echo "VPC deleted successfully."
          fi
          echo "=== Cleanup completed! ==="

